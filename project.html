<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projet — Pierre Riboulet</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/img/favicon/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/img/favicon/favicon-180.png">
  <link rel="stylesheet" href="assets/css/style.v48.css">
</head>
<body>
  <div id="app"></div>

  <script src="assets/js/projects-data.v35.js"></script>
  <script src="assets/js/main.v9.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var slug = params.get("slug");
      var project = (typeof PROJECTS !== "undefined") ? PROJECTS.filter(function (p) {
        return p.slug === slug;
      })[0] : null;

      var app = document.getElementById("app");

      if (!project) {
        app.innerHTML =
          '<div class="not-found">' +
          '<h1 class="project-title">Projet introuvable</h1>' +
          '<a class="back-link" href="index.html">&larr; Back</a>' +
          '</div>';
        document.title = "Projet introuvable — Pierre Riboulet";
        fitTitleToOneLine();
        return;
      }

      document.title = project.title + " — Pierre Riboulet";
      var displayTitle = project.pageTitle || project.title;

      // Image avec repli propre en placeholder tant que le fichier n'est pas en ligne.
      function photoOrPlaceholder(src, label, className) {
        return '<img class="' + className + '" src="' + src + '" alt="' + label + '" ' +
          'onerror="this.outerHTML=\'<div class=&quot;' + className + ' media-placeholder&quot;>' + label + '</div>\'">';
      }

      function escapeAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/"/g, "&quot;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      if (project.about) {
        var a = project.about;

        var experienceHtml = a.experience.map(function (e) {
          return '<div class="exp-item">' +
            '<p class="exp-period">' + e.period + '</p>' +
            '<p class="exp-role">' + e.role + ' <span class="exp-company">— ' + e.company + '</span></p>' +
            '</div>';
        }).join("");

        var educationHtml = a.education.map(function (e) {
          return '<li>' + e + '</li>';
        }).join("");

        var awardsHtml = a.awards.map(function (group) {
          return '<div class="award-group">' +
            '<h3 class="award-org">' + group.org + '</h3>' +
            '<ul class="award-list">' +
            group.items.map(function (i) { return '<li>' + i + '</li>'; }).join("") +
            '</ul></div>';
        }).join("");

        app.innerHTML =
          '<div class="project-page about-page">' +
          '<a class="back-link" href="index.html">&larr; Back</a>' +

          '<div class="about-hero">' +
          photoOrPlaceholder(a.heroPhoto, "Photo à venir", "about-hero-photo") +
          '<div class="about-screens">' +

          '<div class="about-screen about-screen-intro">' +
          '<div class="about-fit about-fit-intro" data-fit-max-vh="38">' +
          '<div class="about-fit-content">' +
          '<h1 class="about-hero-title">' + displayTitle + '</h1>' +
          '<p class="about-hero-description">' + a.description + '</p>' +
          '</div></div>' +
          '</div>' +

          '<div class="about-screen about-screen-awards">' +
          '<div class="about-fit about-fit-awards">' +
          '<div class="about-fit-content">' +
          '<h2 class="about-hero-title">Awards</h2>' +
          '<div class="award-groups">' + awardsHtml + '</div>' +
          '</div></div>' +
          '</div>' +

          '<div class="about-screen about-screen-background">' +
          '<div class="about-fit about-fit-background" data-fit-max-vh="46">' +
          '<div class="about-fit-content">' +
          '<h2 class="about-hero-title">Background</h2>' +
          '<div class="background-columns">' +
          '<section class="about-section">' +
          '<h3 class="about-section-title">Expérience</h3>' +
          experienceHtml +
          '</section>' +
          '<section class="about-section">' +
          '<h3 class="about-section-title">Formation</h3>' +
          '<ul class="education-list">' + educationHtml + '</ul>' +
          '</section>' +
          '</div>' +
          '</div></div>' +
          '</div>' +

          '</div>' +
          '<button class="about-nav-arrow prev" aria-label="Écran précédent">&larr;</button>' +
          '<button class="about-nav-arrow next" aria-label="Écran suivant">&rarr;</button>' +
          '</div>' +
          '</div>';
        setupAboutScreens();
        return;
      }

      var mediaHtml;
      if (project.subprojects) {
        // Page collection (ex: Prints) : une carte par projet qu'elle contiendra.
        mediaHtml = '<div class="project-media">';
        if (project.subprojects.length) {
          project.subprojects.forEach(function (sp) {
            mediaHtml += '<div class="media-placeholder">' + sp.title + '</div>';
          });
        } else {
          mediaHtml += '<div class="media-placeholder">Projets à venir</div>';
        }
        mediaHtml += "</div>";
      } else if (project.media && project.media.length > 1) {
        // Plusieurs médias (photos et/ou vidéos) : carrousel horizontal
        // plutôt qu'un empilement vertical, pour tenir sur un seul écran.
        // Chaque média optionnel "caption" alimente une légende qui change
        // avec la photo active (voir setupPhotoCarousels).
        var hasCaptions = project.media.some(function (m) { return m.caption; });
        mediaHtml = '<div class="photo-carousel">' +
          '<button class="carousel-arrow prev" aria-label="Média précédent">&larr;</button>' +
          '<div class="photo-carousel-track">' +
          project.media.map(function (m) {
            var captionAttr = m.caption ? ' data-caption="' + escapeAttr(m.caption) + '"' : '';
            var slideCaption = m.caption ? '<p class="carousel-slide-caption">' + m.caption + '</p>' : '';
            if (m.type === "vimeo") {
              var vimeoParams = "title=0&byline=0&portrait=0" + (m.hash ? "&h=" + m.hash : "");
              var vimeoSrc = "https://player.vimeo.com/video/" + m.id + "?" + vimeoParams;
              return '<div class="carousel-slide"' + captionAttr + '>' +
                '<div class="carousel-video"><iframe src="' + vimeoSrc + '" ' +
                'allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>' +
                slideCaption + '</div>';
            } else if (m.type === "video") {
              return '<div class="carousel-slide"' + captionAttr + '>' +
                '<div class="carousel-video"><video controls src="' + m.src + '"></video></div>' +
                slideCaption + '</div>';
            } else {
              return '<div class="carousel-slide"' + captionAttr + '>' +
                '<img src="' + m.src + '" alt="' + project.title + '" draggable="false">' +
                slideCaption + '</div>';
            }
          }).join("") +
          '</div>' +
          '<button class="carousel-arrow next" aria-label="Média suivant">&rarr;</button>' +
          '</div>' +
          (hasCaptions ? '<p class="carousel-caption"></p>' : '');
      } else {
        mediaHtml = '<div class="project-media">';
        if (project.media && project.media.length) {
          project.media.forEach(function (m) {
            if (m.type === "vimeo") {
              // title=0&byline=0&portrait=0 : Vimeo affiche par défaut le titre
              // de la vidéo en incrustation sur le lecteur — indépendamment de
              // toute page HTML, c'est Vimeo qui l'ajoute. On le désactive.
              var vimeoParams = "title=0&byline=0&portrait=0" + (m.hash ? "&h=" + m.hash : "");
              var vimeoSrc = "https://player.vimeo.com/video/" + m.id + "?" + vimeoParams;
              mediaHtml += '<div class="video-embed"><iframe src="' + vimeoSrc + '" ' +
                'allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>';
            } else if (m.type === "video") {
              mediaHtml += '<video class="media-placeholder" controls src="' + m.src + '"></video>';
            } else {
              mediaHtml += '<img class="media-placeholder" src="' + m.src + '" alt="' + project.title + '">';
            }
          });
        } else {
          mediaHtml += '<div class="media-placeholder">Photos / vidéo à venir</div>';
        }
        mediaHtml += "</div>";
      }

      var pressHtml = "";
      if (project.pressShots && project.pressShots.length) {
        pressHtml = '<div class="press-grid">' +
          project.pressShots.map(function (src) {
            return '<img class="press-shot" src="' + src + '" alt="' + project.title + ' — retombées réseaux sociaux" loading="lazy">';
          }).join("") +
          '</div>';
      }

      // Quand un projet a des crédits, la description partage sa ligne avec
      // un second bloc à droite (une ou deux colonnes) plutôt que de
      // prendre toute la largeur seule. project.credits = un tableau de
      // colonnes, chaque colonne un tableau de { role, name }.
      var descriptionHtml;
      if (project.credits && project.credits.length) {
        var creditsHtml = '<div class="project-credits">' +
          project.credits.map(function (col) {
            return '<div class="project-credits-col">' +
              col.map(function (c) {
                return '<p><span class="credit-role">' + c.role + '</span>' + c.name + '</p>';
              }).join("") +
              '</div>';
          }).join("") +
          '</div>';
        descriptionHtml = '<div class="project-header">' +
          '<p class="project-description">' + project.description + '</p>' +
          creditsHtml +
          '</div>';
      } else {
        descriptionHtml = '<p class="project-description">' + project.description + '</p>';
      }

      app.innerHTML =
        '<div class="project-page project-page-' + project.slug + '">' +
        '<a class="back-link" href="index.html">&larr; Back</a>' +
        '<h1 class="project-title">' + displayTitle + '</h1>' +
        descriptionHtml +
        mediaHtml +
        pressHtml +
        '</div>';

      fitTitleToOneLine();
      setupPhotoCarousels();
    })();

    // Page About (desktop) : deux "écrans" plein page qu'on parcourt en
    // scrollant horizontalement plutôt que verticalement (la photo de fond
    // reste fixe, seuls les textes en incrustation défilent). Sur mobile,
    // .about-screens redevient un simple flux vertical (voir CSS) et cette
    // fonction n'a rien à faire d'utile — elle reste sans effet néfaste.
    function setupAboutScreens() {
      var track = document.querySelector(".about-screens");
      if (!track) return;
      var prevBtn = document.querySelector(".about-nav-arrow.prev");
      var nextBtn = document.querySelector(".about-nav-arrow.next");
      var isDown = false, startX = 0, startScroll = 0, moved = false;

      function screenWidth() {
        return track.clientWidth || window.innerWidth;
      }

      track.addEventListener("mousedown", function (e) {
        isDown = true;
        moved = false;
        startX = e.pageX;
        startScroll = track.scrollLeft;
        track.classList.add("dragging");
      });
      window.addEventListener("mousemove", function (e) {
        if (!isDown) return;
        e.preventDefault();
        var dx = e.pageX - startX;
        if (Math.abs(dx) > 4) moved = true;
        track.scrollLeft = startScroll - dx;
      });
      window.addEventListener("mouseup", function () {
        isDown = false;
        track.classList.remove("dragging");
      });
      track.addEventListener("click", function (e) {
        if (moved) { e.preventDefault(); e.stopPropagation(); }
      }, true);

      // La molette de souris ne scroll que verticalement par défaut : on
      // convertit ce mouvement vertical en défilement horizontal ici,
      // en plus du geste horizontal natif déjà supporté (trackpad).
      track.addEventListener("wheel", function (e) {
        if (Math.abs(e.deltaY) > Math.abs(e.deltaX)) {
          e.preventDefault();
          track.scrollLeft += e.deltaY;
        }
      }, { passive: false });

      if (prevBtn) {
        prevBtn.addEventListener("click", function () {
          track.scrollBy({ left: -screenWidth(), behavior: "smooth" });
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", function () {
          track.scrollBy({ left: screenWidth(), behavior: "smooth" });
        });
      }

      function updateArrows() {
        if (!prevBtn || !nextBtn) return;
        var atStart = track.scrollLeft < 10;
        var atEnd = track.scrollLeft > track.scrollWidth - track.clientWidth - 10;
        prevBtn.style.visibility = atStart ? "hidden" : "visible";
        nextBtn.style.visibility = atEnd ? "hidden" : "visible";
      }
      track.addEventListener("scroll", updateArrows);
      updateArrows();

      // Chaque écran (About / Awards / Background) doit tenir sans scroll :
      // on réduit son échelle visuelle (transform, pas font-size, pour que
      // ça marche quels que soient les unités CSS utilisées à l'intérieur)
      // jusqu'à ce qu'il rentre dans la place disponible — en hauteur comme
      // en largeur (Awards peut déborder en largeur avec beaucoup de
      // festivals, une colonne par festival).
      var fitEls = document.querySelectorAll(".about-fit");
      if (fitEls.length && window.matchMedia("(min-width: 701px)").matches) {
        function fitToScreen(fitEl) {
          var screen = fitEl.parentElement;
          var content = fitEl.firstElementChild;
          fitEl.style.transform = "scale(1)";
          var availableH = screen.clientHeight - fitEl.offsetTop - 24;
          var maxVh = fitEl.getAttribute("data-fit-max-vh");
          if (maxVh) availableH = Math.min(availableH, screen.clientHeight * (parseFloat(maxVh) / 100));
          var availableW = fitEl.clientWidth;
          var scale = Math.min(1, availableH / content.scrollHeight, availableW / content.scrollWidth);
          fitEl.style.transform = "scale(" + Math.max(scale, 0.01) + ")";
        }
        function fitAll() {
          fitEls.forEach(fitToScreen);
        }
        fitAll();
        window.addEventListener("resize", fitAll);
      }

      // Le lien "other awards" dans le texte About envoie directement sur
      // l'écran Awards (même geste qu'un clic sur la flèche suivante).
      document.querySelectorAll(".about-jump-awards").forEach(function (link) {
        link.addEventListener("click", function (e) {
          e.preventDefault();
          track.scrollBy({ left: screenWidth(), behavior: "smooth" });
        });
      });
    }

    function setupPhotoCarousels() {
      document.querySelectorAll(".photo-carousel").forEach(function (carousel) {
        var track = carousel.querySelector(".photo-carousel-track");
        var prevBtn = carousel.querySelector(".prev");
        var nextBtn = carousel.querySelector(".next");
        var isDown = false, startX = 0, startScroll = 0, moved = false;

        function step() {
          var img = track.querySelector("img");
          return img ? img.getBoundingClientRect().width + 16 : track.clientWidth * 0.8;
        }

        track.addEventListener("mousedown", function (e) {
          isDown = true;
          moved = false;
          startX = e.pageX;
          startScroll = track.scrollLeft;
          track.classList.add("dragging");
        });
        window.addEventListener("mousemove", function (e) {
          if (!isDown) return;
          e.preventDefault();
          var dx = e.pageX - startX;
          if (Math.abs(dx) > 4) moved = true;
          track.scrollLeft = startScroll - dx;
        });
        window.addEventListener("mouseup", function () {
          isDown = false;
          track.classList.remove("dragging");
        });
        // Un drag qui bouge la piste ne doit pas déclencher un clic
        // fantôme (ex: sur une image cliquable) au relâchement.
        track.addEventListener("click", function (e) {
          if (moved) { e.preventDefault(); e.stopPropagation(); }
        }, true);

        prevBtn.addEventListener("click", function () {
          track.scrollBy({ left: -step(), behavior: "smooth" });
        });
        nextBtn.addEventListener("click", function () {
          track.scrollBy({ left: step(), behavior: "smooth" });
        });

        // Légende partagée qui suit la photo active. N'a de sens qu'en
        // carrousel horizontal (desktop) : en version mobile empilée,
        // chaque photo porte déjà sa propre légende (.carousel-slide-caption).
        // On détermine la photo "active" comme celle la plus proche du
        // centre de la piste (cohérent avec scroll-snap-align: center),
        // recalculé à chaque scroll (drag, flèches, trackpad).
        var captionEl = carousel.nextElementSibling;
        if (captionEl && captionEl.classList.contains("carousel-caption") &&
            !window.matchMedia("(max-width: 700px)").matches) {
          // Toutes les diapositives (pas seulement celles avec légende) :
          // ça permet à la légende de s'estomper quand on arrive sur une
          // photo qui n'en a pas, plutôt que de rester bloquée sur la
          // dernière légende trouvée.
          var slides = Array.prototype.slice.call(track.querySelectorAll(".carousel-slide"));
          if (slides.length) {
            var activeSlide = null;
            var captionFadeTimeout = null;
            var updateCaption = function () {
              var trackRect = track.getBoundingClientRect();
              var trackCenter = trackRect.left + trackRect.width / 2;
              var closest = null, closestDist = Infinity;
              slides.forEach(function (s) {
                var r = s.getBoundingClientRect();
                var dist = Math.abs((r.left + r.width / 2) - trackCenter);
                if (dist < closestDist) { closestDist = dist; closest = s; }
              });
              if (closest && closest !== activeSlide) {
                activeSlide = closest;
                var nextText = activeSlide.getAttribute("data-caption") || "";
                // Fondu : on estompe l'ancien texte, puis on écrit le nouveau
                // une fois invisible pour éviter un "cross-fade" illisible.
                if (captionFadeTimeout) clearTimeout(captionFadeTimeout);
                captionEl.style.opacity = "0";
                captionFadeTimeout = setTimeout(function () {
                  captionEl.textContent = nextText;
                  captionEl.style.opacity = "1";
                }, 250);
              }
            };
            updateCaption();
            // Au premier rendu, les images n'ont pas encore chargé : leur
            // largeur réelle (donc leur centre) n'est connue qu'une fois
            // chargées. On recalcule quand leur taille se stabilise.
            if (window.ResizeObserver) {
              var captionResizeObserver = new ResizeObserver(updateCaption);
              slides.forEach(function (s) { captionResizeObserver.observe(s); });
            }
            var captionTicking = false;
            track.addEventListener("scroll", function () {
              if (captionTicking) return;
              captionTicking = true;
              requestAnimationFrame(function () {
                updateCaption();
                captionTicking = false;
              });
            });
          }
        }
      });
    }

    function fitTitleToOneLine() {
      var title = document.querySelector(".project-title");
      if (!title) return;
      // Le titre est en "full-bleed" (voir CSS) et n'est plus contenu par la
      // colonne de 1100px de .project-page ; la largeur dispo se mesure donc
      // sur le titre lui-même (son propre padding), pas sur son parent.
      var container = title;

      function fit() {
        title.style.whiteSpace = "nowrap";
        title.style.fontSize = ""; // repart de la taille CSS (clamp) à chaque mesure
        // scrollWidth (texte + padding du titre) vs clientWidth (boîte du
        // titre, padding inclus puisque box-sizing:border-box) : les deux
        // incluent le padding de la même façon, pas besoin de le soustraire.
        var availableWidth = container.clientWidth;
        var size = parseFloat(getComputedStyle(title).fontSize);
        var minSize = 16;
        while (title.scrollWidth > availableWidth && size > minSize) {
          size -= 1;
          title.style.fontSize = size + "px";
        }
      }

      fit();
      window.addEventListener("resize", fit);
      if (window.ResizeObserver) {
        new ResizeObserver(fit).observe(container);
      }
      if (window.visualViewport) {
        window.visualViewport.addEventListener("resize", fit);
      }
      // Filet de sécurité : le zoom natif du navigateur (Cmd/Ctrl +/-) ne
      // déclenche pas toujours resize/ResizeObserver de façon fiable, ce qui
      // pouvait laisser le titre coincé à une taille calculée pour l'ancien
      // niveau de zoom. Un recalcul périodique garantit que ça se corrige
      // tout seul en moins d'une seconde, quel que soit ce qui a changé.
      setInterval(fit, 800);
    }
  </script>
</body>
</html>
